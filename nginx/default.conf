# Rate limit zones
limit_req_zone $binary_remote_addr zone=rl_general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=rl_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rl_admin:10m rate=50r/m;
limit_req_zone $binary_remote_addr zone=rl_dashboard:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=rl_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=rl_support:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rl_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rl_webhooks:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_sse:10m;

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name smmplan.pro www.smmplan.pro smmflux.ru www.smmflux.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Main HTTPS server (multi-tenant по Host header)
server {
    listen 443 ssl http2;
    server_name smmplan.pro www.smmplan.pro smmflux.ru www.smmflux.ru;

    ssl_certificate /etc/letsencrypt/live/smmplan.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smmplan.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 1M;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 65s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.yookassa.ru https://pay.robokassa.ru https://pay.crypt.bot https://api.telegram.org https://static.cloudflareinsights.com https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none';" always;

    # Proxy defaults at server level
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Блокировка чувствительных файлов
    location ~ /\.(env|git) { deny all; return 404; }

    # Rate limits по путям
    location /api/auth { limit_req zone=rl_auth burst=3 nodelay; proxy_pass http://app:3000; }
    location /api/v2 { limit_req zone=rl_api burst=20 nodelay; proxy_pass http://app:3000; }
    location /api/webhooks { limit_req zone=rl_webhooks burst=15 nodelay; proxy_pass http://app:3000; }
    location /admin { limit_req zone=rl_admin burst=10 nodelay; proxy_pass http://app:3000; }
    location /dashboard { limit_req zone=rl_dashboard burst=10 nodelay; proxy_pass http://app:3000; }

    # SSE (support chat stream) — специфичный путь ПЕРЕД общим /api/support
    location /api/support/stream {
        limit_conn conn_sse 50;
        proxy_pass http://app:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /api/support { limit_req zone=rl_support burst=5 nodelay; proxy_pass http://app:3000; }
    location /api/upload { 
        limit_req zone=rl_upload burst=3 nodelay;
        client_max_body_size 10M;
        proxy_pass http://app:3000;
    }

    # Default
    location / {
        limit_req zone=rl_general burst=30 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
