name: Disaster Recovery Verification

on:
  schedule:
    - cron: '0 3 1 * *' # Monthly at 03:00 UTC on the 1st
  workflow_dispatch:

jobs:
  dr-restore-test:
    name: Automated Backup & Schema Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts=true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Execute DR Restore Simulation
        run: npx tsx scripts/dr-restore-test.ts
