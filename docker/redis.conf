# Redis configuration for SMMplan

# Set maximum memory limit (prevent OOM crashes when storing large provider catalogs)
maxmemory 512mb

# Eviction policy: Evict any key using approximated LRU (Least Recently Used) when maxmemory is reached
maxmemory-policy allkeys-lru

# Save snapshots less aggressively to save I/O
save 900 1
save 300 10

# Enforce protected mode
protected-mode yes
