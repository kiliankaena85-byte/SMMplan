name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Build & Verify Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smmplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dependency Security Audit
        run: npm audit --audit-level=high --omit=dev || true

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run ESLint Security Verification
        run: npx eslint src/ --max-warnings=0 || true

      - name: Push Database Schema to Test Container
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/smmplan_test?schema=public"
        run: npx prisma db push --skip-generate

      - name: Run Vitest Suite
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/smmplan_test?schema=public"
          REDIS_URL: "redis://127.0.0.1:6379"
          JWT_SECRET: "ci-test-jwt-secret-min-32-characters-length-guaranteed"
          APP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_SECRET: "ci-cron-secret-token"
        run: npx vitest run --reporter=verbose

      - name: Next.js Production Build Verification
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/smmplan_test?schema=public"
          REDIS_URL: "redis://127.0.0.1:6379"
          JWT_SECRET: "ci-test-jwt-secret-min-32-characters-length-guaranteed"
          APP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CRON_SECRET: "ci-cron-secret-token"
        run: npm run build

      - name: Verify No Secrets in Build Artifacts
        run: node scripts/verify-no-secrets.js
