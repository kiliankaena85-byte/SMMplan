# Smmplan_lite Local Dev Infrastructure

services:
  db:
    image: postgres:15-alpine
    container_name: smmplan_lite_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smmplan_lite
    volumes:
      - lite_postgres_data:/var/lib/postgresql/data
    ports:
      # Expose on 5433 to prevent conflict with Smmplan legacy db
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: smmplan_lite_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 1024mb --maxmemory-policy volatile-lru
    volumes:
      - lite_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    image: node:20-alpine
    container_name: smmplan_lite_worker
    working_dir: /app
    volumes:
      - ./:/app
    command: ./node_modules/.bin/tsx src/workers/index.ts
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smmplan_lite?schema=public&connection_limit=5&pool_timeout=30
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    container_name: smmplan_web
    restart: always
    # Load all secrets from .env (local dev keys, API tokens, etc.)
    # DATABASE_URL and REDIS_URL are overridden below to use Docker service names
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Override to use Docker internal service DNS (not localhost)
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smmplan_lite?schema=public&connection_limit=5&pool_timeout=30
      - REDIS_URL=redis://redis:6379
      - RUN_MIGRATIONS=false
      - HOSTNAME=0.0.0.0
      - PORT=3000
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  lite_postgres_data:
  lite_redis_data:
