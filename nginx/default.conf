# ── Rate Limiting Zones (P1.2 & DevSecOps Hardening) ───────────────────────────
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=dashboard:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=support_messages:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=support_upload:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=media:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=order_status:10m rate=30r/m;

limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ── Anti-DDoS Real IP Setup (DDoS-Guard / StormWall / Qrator) ─────────────────
# Uncomment & add trusted proxy CIDRs if using external L3/L4 Anti-DDoS provider:
# set_real_ip_from 185.178.208.0/24; # Example DDoS-Guard CIDR
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name smmplan.pro www.smmplan.pro smmflux.ru www.smmflux.ru;
    server_tokens off;
    client_max_body_size 1M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smmplan.pro smmflux.ru;
    server_tokens off;
    client_max_body_size 1M;

    # Slowloris & Connection Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    ssl_certificate /etc/letsencrypt/live/smmplan.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smmplan.pro/privkey.pem;

    # SSL Config (Hardened — 3DES Removed, ECDHE Priority)
    ssl_buffer_size 8k;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve secp384r1;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;

    # ── Security Headers (P1.3 — OWASP) ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.telegram.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    proxy_hide_header X-Powered-By;

    # Block Invalid HTTP Methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 405;
    }

    # ── Admin Panel Protection (IP Allowlist placeholder + Rate Limit) ────────
    location /admin {
        # Uncomment & add operator IP allowlist if static IP is used:
        # allow 185.0.0.1;
        # deny all;

        limit_req zone=admin burst=20 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Dashboard Protection ──────────────────────────────────────────────────
    location /dashboard {
        limit_req zone=dashboard burst=40 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate-limited Locations (Webhooks & API) ───────────────────────────────

    # Webhook protection: 30 req/s burst 50, then 429
    location /api/webhooks/ {
        limit_req zone=webhooks burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support Uploads Limit (10MB max body)
    location /api/support/upload {
        limit_req zone=support_upload burst=5 nodelay;
        client_max_body_size 10M;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support Messages Rate Limit
    location /api/support/messages {
        limit_req zone=support_messages burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public API v2 protection: 10 req/s burst 20
    location /api/v2 {
        limit_req zone=api_public burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth (magic link): 5 req/min burst 3
    location /api/auth/ {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE Live Chat Stream (Unbuffered & Limit Conn) ────────────────────────
    location /api/support/chat/stream {
        limit_conn conn_per_ip 5;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Disable all buffering and caching for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long-lived connection timeouts (24h max session)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Required for SSE: no Connection upgrade, keep-alive
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_except GET HEAD POST OPTIONS {
            deny all;
        }
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_cache_bypass $http_upgrade;
        access_log off;
        expires max;
    }

    # Block sensitive paths & backup extensions
    location ~ /\.(git|svn|hg|env|aws|ssh) {
        deny all;
        return 404;
    }

    location ~* \.(bak|old|orig|save|swp|dist|config|sql|dump|log)$ {
        deny all;
        return 404;
    }

    location ~* /_next/static/.*/_(build|ssg)Manifest {
        return 404;
    }
}
