services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend]

  app:
    build: .
    env_file:
      - path: .env.production
        required: false
    environment:
      - RUN_MIGRATIONS=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend, backend]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: .
      target: worker-runner
    command: ["./node_modules/.bin/tsx", "src/workers/index.ts"]
    env_file:
      - path: .env.production
        required: false
    environment:
      - RUN_MIGRATIONS=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smmplan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smmplan}?schema=public&connection_limit=20&pool_timeout=30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const r=require('ioredis');const c=new r({host:'redis',password:process.env.REDIS_PASSWORD});c.exists('worker:heartbeat').then(v=>{c.quit();process.exit(v?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [backend]
    # БЕЗ публикации портов наружу

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [backend]
    # БЕЗ публикации портов наружу

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
  backend:
    internal: true   # изолированная сеть, без внешнего доступа
