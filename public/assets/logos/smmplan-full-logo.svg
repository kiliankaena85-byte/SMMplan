<svg viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="planSkyGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="planInnerShadowFull" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="2" />
      <feGaussianBlur stdDeviation="2" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#000000" flood-opacity="0.2" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- SMMplan Icon Mark -->
  <rect
    x="2"
    y="6"
    width="48"
    height="48"
    rx="13"
    fill="url(#planSkyGradFull)"
    filter="url(#planInnerShadowFull)"
  />
  <text
    x="26"
    y="31"
    dominant-baseline="central"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="36"
    letter-spacing="-0.04em"
  >
    S
  </text>

  <!-- SMMplan Text -->
  <text
    x="62"
    y="32"
    dominant-baseline="central"
    fill="#0F172A"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-weight="900"
    font-size="24"
    letter-spacing="-0.03em"
  >
    SMM<tspan fill="#0284C7">plan</tspan>
  </text>
</svg>
