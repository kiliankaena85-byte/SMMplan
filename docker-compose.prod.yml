# SMMplan Lite Production Infrastructure (RF Compliance & DevSecOps Hardened)

version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: smmplan_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smmplan_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?DB password required}
      POSTGRES_DB: ${POSTGRES_DB:-smmplan_prod}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    # DO NOT EXPOSE POSTGRES EXTERNAL PORT IN PRODUCTION
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smmplan_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: smmplan_prod_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Redis password required}
      --appendonly yes
      --maxmemory-policy noeviction
      --loglevel warning
    volumes:
      - prod_redis_data:/data
    # DO NOT EXPOSE REDIS EXTERNAL PORT IN PRODUCTION
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smmplan_prod_web
    restart: always
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
    ports:
      - "127.0.0.1:3000:3000" # Expose only to local Nginx reverse proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smmplan_prod_worker
    restart: always
    command: ["npx", "tsx", "src/workers/index.ts"]
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  internal_network:
    driver: bridge
    internal: false

volumes:
  prod_postgres_data:
  prod_redis_data:
