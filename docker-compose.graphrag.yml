services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: graphrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    deploy:
      resources:
        limits:
          memory: 2G

  neo4j:
    image: neo4j:5.26-community
    container_name: graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m

  graphrag-api:
    build:
      context: ./knowledge-service
      dockerfile: Dockerfile
    container_name: graphrag-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    volumes:
      - ./knowledge-service:/app

  indexer:
    build:
      context: ./knowledge-service
      dockerfile: Dockerfile.indexer
    container_name: graphrag-indexer
    restart: unless-stopped
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - WATCH_PATHS=/app/codebase,/app/docs
      - INDEX_INTERVAL=300
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    volumes:
      - .:/app/codebase:ro
      - ./project-docs:/app/docs:ro
      - ./knowledge-service:/app

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
