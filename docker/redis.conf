# Redis configuration for SMMplan

# Set maximum memory limit (prevent OOM crashes when storing large provider catalogs)
maxmemory 512mb

# Eviction policy: Return errors when memory limit was reached and client is trying to execute commands that could result in more memory being used
maxmemory-policy noeviction

# AOF persistence
appendonly yes

# Save snapshots
save 900 1
save 300 10

# Enforce protected mode
protected-mode yes
