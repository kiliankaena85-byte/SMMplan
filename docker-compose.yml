# Smmplan_lite Local Dev Infrastructure

services:
  db:
    image: postgres:15-alpine
    container_name: smmplan_lite_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smmplan_lite
    volumes:
      - lite_postgres_data:/var/lib/postgresql/data
    ports:
      # Expose on 5433 to prevent conflict with Smmplan legacy db (localhost-only)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: smmplan_lite_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-SmmP1anR3dis2026Secure!} --save 60 1 --loglevel warning --maxmemory 1024mb --maxmemory-policy volatile-lru
    volumes:
      - lite_redis_data:/data
    ports:
      # Localhost only: internal containers use docker network, blocks public internet access
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  clash:
    image: metacubex/mihomo:latest
    container_name: smmplan_clash
    restart: always
    # TUN mode requires NET_ADMIN + /dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    volumes:
      - ./clash:/root/.config/mihomo
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:7890:7890"
      - "127.0.0.1:9090:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot-runner
    container_name: smmplan_bot
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smmplan_lite?schema=public&connection_limit=5&pool_timeout=30
      - REDIS_URL=redis://:${REDIS_PASSWORD:-SmmP1anR3dis2026Secure!}@redis:6379
      - BOT_TENANT_ID=smmplan
      # TELEGRAM_PROXY_URL is NOT hardcoded — telegram-agent.ts auto-detects:
      # 1. Direct probe to api.telegram.org (2.5s timeout)
      #    → OK  → OS-level VPN (Clash Verge TUN) is active, no proxy needed
      #    → Fail → use internal Mihomo container below
      - CLASH_INTERNAL_PROXY_URL=http://clash:7890
    volumes:
      - lite_uploads_data:/app/private/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clash:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
    container_name: smmplan_lite_worker
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smmplan_lite?schema=public&connection_limit=5&pool_timeout=30
      - REDIS_URL=redis://:${REDIS_PASSWORD:-SmmP1anR3dis2026Secure!}@redis:6379
      - CLASH_PROXY_URL=http://clash:7890
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck-worker.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clash:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: smmplan_web
    restart: always
    # Load all secrets from .env (local dev keys, API tokens, etc.)
    # DATABASE_URL and REDIS_URL are overridden below to use Docker service names
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Override to use Docker internal service DNS (not localhost)
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smmplan_lite?schema=public&connection_limit=5&pool_timeout=30
      - REDIS_URL=redis://:${REDIS_PASSWORD:-SmmP1anR3dis2026Secure!}@redis:6379
      - CLASH_PROXY_URL=http://clash:7890
      - RUN_MIGRATIONS=false
      - SKIP_BOT=true
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - lite_uploads_data:/app/private/uploads
    ports:
      - "3000:3000"
    dns:
      - 77.88.8.8
      - 8.8.8.8
      - 1.1.1.1
    networks:
      default:
        aliases:
          - host.docker.internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clash:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  lite_postgres_data:
  lite_redis_data:
  lite_uploads_data:
